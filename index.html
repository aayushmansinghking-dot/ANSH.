<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hacker Access</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: 'Courier New', monospace;}
body{
    background:black;
    color:#00ff99;
    overflow:hidden;
}

/* ---------- PAGE 1 ---------- */
#login{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:black;
    z-index:10;
}

#login h1{
    color:#00ff99;
    margin-bottom:20px;
    letter-spacing:3px;
}

#nameInput{
    padding:15px;
    width:260px;
    font-size:20px;
    background:black;
    border:2px solid #00ff99;
    color:#00ff99;
    text-align:center;
    outline:none;
}

#warning{
    margin-top:20px;
    font-size:18px;
    color:red;
    text-shadow:0 0 10px red;
    animation:shake .3s infinite alternate;
}

@keyframes shake{
    from{transform:translateX(-3px);}
    to{transform:translateX(3px);}
}

/* ---------- PAGE 2 ---------- */
#system{
    display:none;
    position:fixed;
    inset:0;
}

/* MATRIX */
canvas{
    position:absolute;
    inset:0;
}

/* HUD */
.hud{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.circle{
    position:absolute;
    width:300px;
    height:300px;
    border:2px solid #00ff99;
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    animation:spin 6s linear infinite;
}

.circle::after{
    content:'';
    position:absolute;
    inset:20px;
    border:2px dashed #00ff99;
    border-radius:50%;
}

@keyframes spin{
    from{transform:translate(-50%,-50%) rotate(0deg);}
    to{transform:translate(-50%,-50%) rotate(360deg);}
}

/* CONSOLE */
#console{
    position:absolute;
    bottom:20px;
    left:20px;
    width:90%;
    max-width:500px;
    height:180px;
    border:2px solid #00ff99;
    padding:10px;
    background:rgba(0,0,0,0.6);
    overflow:hidden;
    font-size:14px;
}

/* SCAN LINE */
.scan{
    position:absolute;
    width:100%;
    height:3px;
    background:#00ff99;
    top:-10px;
    animation:scan 3s linear infinite;
}

@keyframes scan{
    from{top:-10px;}
    to{top:100%;}
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div id="login">
    <h1>SECURE ACCESS</h1>
    <input id="nameInput" placeholder="ENTER NAME" autofocus>
    <div id="warning"></div>
</div>

<!-- PAGE 2 -->
<div id="system">
    <canvas id="matrix"></canvas>

    <div class="hud">
        <div class="circle"></div>
        <div class="scan"></div>
    </div>

    <div id="console"></div>
</div>

<script>
/* ---------- LOGIN LOGIC ---------- */
let attempts = 2;

document.getElementById("nameInput").addEventListener("keydown", e=>{
    if(e.key==="Enter"){
        const name = e.target.value.trim().toUpperCase();
        if(name==="AAYUSHMAN"){
            document.getElementById("login").style.display="none";
            document.getElementById("system").style.display="block";
            startMatrix();
            startConsole();
            startVoice();
            startMusic();
        }else{
            attempts--;
            document.getElementById("warning").innerHTML =
              "⚠ ACCESS DENIED<br>"+attempts+" ATTEMPTS LEFT";
            if(attempts<=0){
                document.getElementById("warning").innerHTML="SYSTEM LOCKED";
            }
        }
    }
});

/* ---------- MATRIX ---------- */
function startMatrix(){
    const c=document.getElementById("matrix");
    const ctx=c.getContext("2d");
    c.width=innerWidth;
    c.height=innerHeight;
    const letters="1010101010ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const font=16;
    const cols=c.width/font;
    const drops=Array(Math.floor(cols)).fill(1);

    setInterval(()=>{
        ctx.fillStyle="rgba(0,0,0,0.1)";
        ctx.fillRect(0,0,c.width,c.height);
        ctx.fillStyle="#00ff99";
        ctx.font=font+"px monospace";
        for(let i=0;i<drops.length;i++){
            const text=letters[Math.floor(Math.random()*letters.length)];
            ctx.fillText(text,i*font,drops[i]*font);
            if(drops[i]*font>c.height && Math.random()>0.975) drops[i]=0;
            drops[i]++;
        }
    },33);
}

/* ---------- CONSOLE TYPING ---------- */
function startConsole(){
    const box=document.getElementById("console");
    const lines=[
        "Initializing AI core...",
        "Decrypting secure layers...",
        "Neural interface online...",
        "System authenticated.",
        "Welcome back AAYUSHMAN.",
        "Let's complete the work."
    ];
    let i=0,j=0;
    setInterval(()=>{
        if(i<lines.length){
            if(j<lines[i].length){
                box.innerHTML+=lines[i][j++];
            }else{
                box.innerHTML+="<br>";
                i++;j=0;
            }
            box.scrollTop=box.scrollHeight;
        }
    },40);
}

/* ---------- JARVIS VOICE ---------- */
function startVoice(){
    const msg=new SpeechSynthesisUtterance(
      "Welcome back Aayushman. Let's complete the work."
    );
    msg.rate=1.3;      // faster robotic
    msg.pitch=0.6;     // deep AI
    msg.lang="en-US";
    speechSynthesis.speak(msg);
}

/* ---------- BACKGROUND MUSIC ---------- */
function startMusic(){
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.type="sawtooth";
    osc.frequency.value=60;
    gain.gain.value=0.05;
    osc.connect(gain).connect(ctx.destination);
    osc.start();
}
</script>

</body>
</html>
