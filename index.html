<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JARVIS AI ACCESS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Courier New", monospace;
}
body{
  background:black;
  color:#00f6ff;
  overflow:hidden;
}

/* ---------- COMMON ---------- */
.center{
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}
input{
  padding:15px;
  width:260px;
  background:black;
  border:2px solid #00f6ff;
  color:#00f6ff;
  font-size:1.1rem;
  text-align:center;
}
h1{
  margin-bottom:20px;
  text-shadow:0 0 20px #00f6ff;
}

/* ---------- WARNING ---------- */
#warning{
  display:none;
  background:red;
  color:white;
  animation:shake 0.4s infinite;
}
@keyframes shake{
  0%{transform:translateX(0)}
  25%{transform:translateX(-10px)}
  50%{transform:translateX(10px)}
  75%{transform:translateX(-10px)}
  100%{transform:translateX(0)}
}

/* ---------- AI PAGE ---------- */
#aiPage{
  display:none;
}
.grid{
  position:fixed;
  inset:0;
  background:
    linear-gradient(#00f6ff22 1px, transparent 1px),
    linear-gradient(90deg,#00f6ff22 1px, transparent 1px);
  background-size:40px 40px;
  z-index:-1;
}

/* AI CORE */
#core{
  position:absolute;
  top:30%;
  left:50%;
  transform:translate(-50%,-50%);
  width:180px;
  height:180px;
  border-radius:50%;
  border:3px solid #00f6ff;
  box-shadow:0 0 50px #00f6ff;
  animation:spin 6s linear infinite;
}
@keyframes spin{
  from{transform:translate(-50%,-50%) rotate(0deg)}
  to{transform:translate(-50%,-50%) rotate(360deg)}
}

/* TERMINAL */
#terminal{
  position:absolute;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  width:90%;
  max-width:900px;
  height:260px;
  border:2px solid #00f6ff;
  padding:15px;
  background:rgba(0,0,0,0.85);
}
#output{
  white-space:pre-wrap;
  font-size:1rem;
}
#cmd{
  width:100%;
  background:black;
  border:none;
  color:#00f6ff;
  font-size:1rem;
  outline:none;
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div id="login" class="center">
  <h1>SECURE AI SYSTEM</h1>
  <input id="nameInput" placeholder="ENTER NAME">
</div>

<!-- WARNING -->
<div id="warning" class="center">
  <h1>⚠ ACCESS DENIED ⚠</h1>
  <p id="attemptText">2 ATTEMPTS LEFT</p>
</div>

<!-- PAGE 2 -->
<div id="aiPage">
  <div class="grid"></div>
  <div id="core"></div>

  <div id="terminal">
    <div id="output"></div>
    <input id="cmd" placeholder="> type command and press enter">
  </div>
</div>

<!-- AUDIO -->
<audio id="hum" loop src="https://assets.mixkit.co/sfx/preview/mixkit-sci-fi-hum-2135.mp3"></audio>
<audio id="music" loop src="https://assets.mixkit.co/music/preview/mixkit-cyberpunk-ambient-2161.mp3"></audio>

<script>
let attempts = 2;
const correctName = "AAYUSHMAN";

const logs = [
  "Initializing JARVIS AI...",
  "Scanning identity...",
  "Access granted.",
  "Loading neural network...",
  "System online.",
  "Welcome back AAYUSHMAN."
];

/* VOICE */
function speak(text){
  const msg = new SpeechSynthesisUtterance(text);
  msg.rate = 0.75;
  msg.pitch = 0.5;
  msg.volume = 1;
  speechSynthesis.speak(msg);
}

/* TERMINAL TYPING */
function startTerminal(){
  let i = 0;
  const out = document.getElementById("output");

  function type(){
    if(i < logs.length){
      out.innerHTML += logs[i++] + "\n";
      setTimeout(type, 500);
    }
  }
  type();
}

/* ENTER KEY */
document.getElementById("nameInput").addEventListener("keydown", e=>{
  if(e.key === "Enter"){
    checkAccess();
  }
});

function checkAccess(){
  const val = nameInput.value.trim().toUpperCase();

  if(val === correctName){
    login.style.display = "none";
    warning.style.display = "none";
    aiPage.style.display = "block";

    hum.volume = 0.3;
    music.volume = 0.25;
    hum.play();
    music.play();

    speak("WELCOME BACK AAYUSHMAN. LET'S COMPLETE THE WORK.");
    startTerminal();
  }else{
    attempts--;
    login.style.display = "none";
    warning.style.display = "flex";
    attemptText.innerText = attempts + " ATTEMPTS LEFT";

    if(attempts > 0){
      setTimeout(()=>{
        warning.style.display = "none";
        login.style.display = "flex";
        nameInput.value = "";
      },2000);
    }else{
      attemptText.innerText = "SYSTEM LOCKED";
    }
  }
}

/* TERMINAL COMMAND INPUT */
cmd.addEventListener("keydown", e=>{
  if(e.key === "Enter"){
    output.innerHTML += "> " + cmd.value + "\n";
    cmd.value = "";
  }
});
</script>

</body>
</html>
