<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Access System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ===== GLOBAL ===== */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Courier New', monospace;
}
body{
    background:black;
    overflow:hidden;
    color:#0f0;
}

/* ===== PAGE 1 ===== */
#loginPage{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
}
#loginPage h1{
    font-size:2.5rem;
    margin-bottom:20px;
    text-shadow:0 0 20px #0f0;
}
#nameInput{
    padding:15px;
    font-size:1.2rem;
    width:280px;
    text-align:center;
    border:2px solid #0f0;
    background:black;
    color:#0f0;
    outline:none;
}
#enterBtn{
    margin-top:20px;
    padding:12px 40px;
    font-size:1.1rem;
    border:none;
    cursor:pointer;
    background:#0f0;
    color:black;
}

/* ===== WARNING PAGE ===== */
#warningPage{
    display:none;
    height:100vh;
    background:red;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    animation:shake 0.5s infinite;
}
@keyframes shake{
    0%{transform:translateX(0)}
    25%{transform:translateX(-10px)}
    50%{transform:translateX(10px)}
    75%{transform:translateX(-10px)}
    100%{transform:translateX(0)}
}
#warningPage h1{
    font-size:3rem;
}
#attempts{
    margin-top:15px;
    font-size:1.5rem;
}

/* ===== AI PAGE ===== */
#aiPage{
    display:none;
    height:100vh;
    background:radial-gradient(circle at center, #001, #000);
    color:#0ff;
    perspective:1000px;
}
#aiContainer{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) rotateX(15deg);
    text-align:center;
}
#aiTitle{
    font-size:3rem;
    text-shadow:0 0 30px #0ff;
    animation:pulse 2s infinite;
}
@keyframes pulse{
    0%{text-shadow:0 0 10px #0ff}
    50%{text-shadow:0 0 40px #0ff}
    100%{text-shadow:0 0 10px #0ff}
}

/* MATRIX BACKGROUND */
canvas{
    position:fixed;
    top:0;
    left:0;
    z-index:-1;
}
</style>
</head>

<body>

<!-- MATRIX -->
<canvas id="matrix"></canvas>

<!-- LOGIN -->
<div id="loginPage">
    <h1>SECURE AI SYSTEM</h1>
    <input id="nameInput" placeholder="ENTER YOUR NAME" autofocus>
    <button id="enterBtn">ENTER</button>
</div>

<!-- WARNING -->
<div id="warningPage">
    <h1>⚠ ACCESS DENIED ⚠</h1>
    <div id="attempts">2 ATTEMPTS LEFT</div>
</div>

<!-- AI PAGE -->
<div id="aiPage">
    <div id="aiContainer">
        <div id="aiTitle">AI SYSTEM ONLINE</div>
        <p style="margin-top:20px;font-size:1.3rem;">
            WELCOME BACK AAYUSHMAN
        </p>
    </div>
</div>

<script>
/* ===== MATRIX EFFECT ===== */
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
const letters = "01";
const fontSize = 16;
const columns = canvas.width / fontSize;
const drops = Array(Math.floor(columns)).fill(1);

function drawMatrix(){
    ctx.fillStyle="rgba(0,0,0,0.05)";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="#0f0";
    ctx.font=fontSize+"px monospace";
    for(let i=0;i<drops.length;i++){
        const text = letters[Math.floor(Math.random()*letters.length)];
        ctx.fillText(text,i*fontSize,drops[i]*fontSize);
        if(drops[i]*fontSize>canvas.height && Math.random()>0.975){
            drops[i]=0;
        }
        drops[i]++;
    }
}
setInterval(drawMatrix,50);

/* ===== LOGIC ===== */
let attempts = 2;
const input = document.getElementById("nameInput");

function speak(text){
    const msg = new SpeechSynthesisUtterance(text);
    msg.rate = 0.9;
    msg.pitch = 1;
    speechSynthesis.speak(msg);
}

function checkName(){
    const name = input.value.trim().toUpperCase();

    if(name === "AAYUSHMAN"){
        document.getElementById("loginPage").style.display="none";
        document.getElementById("warningPage").style.display="none";
        document.getElementById("aiPage").style.display="block";
        speak("WELCOME BACK AAYUSHMAN, LET'S COMPLETE THE WORK");
    }else{
        attempts--;
        document.getElementById("loginPage").style.display="none";
        document.getElementById("warningPage").style.display="flex";
        document.getElementById("attempts").innerText =
            attempts + " ATTEMPTS LEFT";

        if(attempts<=0){
            document.getElementById("attempts").innerText =
            "SYSTEM LOCKED";
        }else{
            setTimeout(()=>{
                document.getElementById("warningPage").style.display="none";
                document.getElementById("loginPage").style.display="flex";
                input.value="";
            },2000);
        }
    }
}

document.getElementById("enterBtn").onclick = checkName;
input.addEventListener("keydown",e=>{
    if(e.key==="Enter") checkName();
});
</script>

</body>
</html>
